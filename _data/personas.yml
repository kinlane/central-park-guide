# Personas users can select on the /updates/ signup form. Each maps to one
# or more event tags so a persona's landing page can list the events they
# care about. Tag values match the Title Case form stored on event files.
personas:
  - id: runner
    title: "Runner"
    blurb: "Race calendars, route closures, and the long-loop traffic windows."
    icon: /assets/images/personas/runner.png
    tags: [Running, Race, Marathon, "Runs & Races"]
    email_filter:
      audience: "runners"
      hard_include_affects_loop: true
      include_tags: [Running, Race, Marathon, "Runs & Races", "Affects Loop", Walk, Closures, Maintenance]
      exclude_tags: ["Private Events", "Private Booking", Wedding, Ceremony, Reception, Birthday, Celebration, "Concerts & Performances", Theater, Picnic, Market, Tennis, Softball, T-Ball, Baseball, Kickball, Soccer, "Family & Community", Education, "School Program"]

  - id: walker
