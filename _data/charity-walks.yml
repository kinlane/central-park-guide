  - id: nyrr-ted-corbitt-15k
    title: "NYRR Ted Corbitt 15K"
    organizer: "New York Road Runners"
    source_url: "https://events.nyrr.org/nyrr-ted-corbitt-15k"
    recurrence: "Early December"
    dates:
      "2026": "2026-12-05"
    start_time: "08:00"
    end_time: "10:30"
    location: "Ted Corbitt Loop"
    event_type: "Race"
    event_borough: "Manhattan"
    affects_loop: true
    route_impact: >
      The 18th annual running of the race honoring Ted Corbitt (1919–2007), the
      NYRR founding president the park's 6.02-mile loop is named for. Roughly a
      loop and a half of the drives from 8 AM on a Saturday morning. Start line
      and course map are published closer to race day.
    audience_relevance:
      - runners
      - cyclists
      - park-watcher
    description: >
      New York Road Runners' 15K in Central Park honoring the life and legacy of
      Ted Corbitt, the first African American Olympic marathoner and NYRR's
      founding president.
    tags:
