  - id: nyrr-team-championships
    title: "NYRR Team Championships 5M"
    organizer: "New York Road Runners"
    source_url: "https://events.nyrr.org/nyrr-team-championships-5m"
    recurrence: "Late-July Sunday (typical)"
    dates:
      "2026": "2026-07-26"
    start_time: "07:30"
    end_time: "10:00"
    location: "102nd Street Cross Drive"
    event_type: "Charity Run"
    event_borough: "Manhattan"
    expected_attendance: 5000
    affects_loop: true
    route_impact: >
      NYRR club-team 5-mile championship on the park drives, first wave 7:30 AM
      Sunday with staggered men's, women's, and non-binary starts through
      mid-morning. Start and finish are on the 102nd Street Cross Drive, heading
      west onto West Drive and running the lower loop. Expect the full loop to
      carry race traffic roughly 7–10 AM, with staging and breakdown on the
      north end from 6 AM. Run or ride before 6:30 or after 10:30, or use the
      Bridle Path / Reservoir.
    audience_relevance:
      - runners
      - cyclists
      - walkers
      - sports-fan
      - park-watcher
    description: >
      New York Road Runners' annual club Team Championships, a five-mile race in
      Central Park worth double points in the NYRR Club Points Series.
    tags:
      - charity
      - race
      - running
      - affects-loop
      - annual-tradition

  # ── NYRR Central Park races ────────────────────────────────────────────
  # NYRR races reach this file because the NYRR enrichment step only *enhances*
  # races already present in NYC Open Data, and the permit feed doesn't carry
  # them. nyrr.org itself sits behind Queue-It, so each entry below was verified
  # on the (unqueued) events.nyrr.org detail page linked in `source_url`.
  # Verified 2026-07-26. NYRR publishes start lines and course maps close to
  # race day ("check back closer to the race"), so `location` uses the Ted
  # Corbitt Loop — the officially named full circuit of the park drives — unless
  # a specific drive is confirmed on the race page.

  - id: nyrr-marathon-training-12m
    title: "TCS New York City Marathon Training Series 12M"
    organizer: "New York Road Runners"
    source_url: "https://events.nyrr.org/tcs-new-york-city-marathon-training-series-12m"
    recurrence: "Mid-August, ~11 weeks before marathon weekend"
    dates:
      "2026": "2026-08-15"
    start_time: "07:00"
    end_time: "10:30"
    location: "East Drive, 102nd Street Cross Drive"
    event_type: "Race"
    event_borough: "Manhattan"
    affects_loop: true
    route_impact: >
      First of the marathon training-series runs — two loops of the park drives
      at marathon pace, starting 7 AM. Race-Day Central is behind the backstop
      of Ballfield #8 near East Drive and 102nd Street, so the north end carries
      staging from around 5:30 AM. Expect the full loop to be busy with runners
      until mid-morning; the loop is not closed to the public, but it will be
      crowded and slow for cyclists.
    audience_relevance:
      - runners
      - cyclists
      - park-watcher
    description: >
      New York Road Runners' 12-mile marathon training run in Central Park, the
      first of the two-race TCS New York City Marathon Training Series.
    tags:
      - race
      - running
      - marathon
      - affects-loop
      - annual-tradition

