      - park-watcher
    description: >
      New York Road Runners' 18-mile marathon training run in Central Park, the
      second and longer leg of the TCS New York City Marathon Training Series.
    tags:
      - race
      - running
      - marathon
      - affects-loop
      - annual-tradition

  - id: tcs-nyc-marathon
    title: "TCS New York City Marathon"
    organizer: "New York Road Runners"
    source_url: "https://events.nyrr.org/tcs-new-york-city-marathon"
    recurrence: "First Sunday of November"
    dates:
      "2026": "2026-11-01"
    start_time: "08:00"
    end_time: "17:00"
    location: "Ted Corbitt Loop"
    event_type: "Race"
    event_borough: "Manhattan"
    expected_attendance: 55000
    affects_loop: true
    route_impact: >
      The marathon starts on Staten Island at 8 AM and runs all five boroughs;
      its final miles come into Central Park, where the race finishes. The park
      is given over to the race and its spectators from early morning into the
      afternoon — treat the drives, the south end, and Central Park West as
      unusable for running or riding all day. NYRR publishes the closure map and
      spectator guidance closer to race day.
    audience_relevance:
      - runners
      - cyclists
      - walkers
      - sports-fan
      - park-watcher
    description: >
      The TCS New York City Marathon, the world's largest marathon — 26.2 miles
      across all five boroughs, starting on Staten Island and finishing in
      Central Park.
    tags:
      - race
      - running
      - marathon
      - affects-loop
      - annual-tradition

